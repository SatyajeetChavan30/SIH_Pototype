[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwis"
version = "0.1.0"
description = "eRTMAC-NWIS: Nearby Wells Intelligence System (SIH PS 26121 prototype)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "networkx>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
# rapidocr-onnxruntime stops at Python 3.12; its successor rapidocr 3.x (models bundled in the wheel) covers 3.13+
ocr = [
    "rapidocr-onnxruntime>=1.3; python_version < '3.13'",
    "rapidocr>=3.0; python_version >= '3.13'",
    "onnxruntime>=1.20; python_version >= '3.13'",
]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nwis*"]

[tool.setuptools.package-data]
nwis = ["data/samples/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
